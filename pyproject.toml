[project]
name = "insurance-verify"
version = "0.1.0"
description = "Pipeline: photo of a dental insurance card -> verified eligibility result + plain-English benefit summary. Synthetic data only, no real PHI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "faker>=24",
    "pillow>=10",
    "fastapi>=0.110",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff",
    "pyright",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insurance_verify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The tests import the root-level synth package (payer formats), which is not
# in the installed wheel — put the repo root on sys.path for collection.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
